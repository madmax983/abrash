[package]
name = "abrash"
version = "0.1.0"
edition = "2024"

[features]
default = ["backend-win32"]
simd = []
backend-win32 = ["dep:windows-sys"]
backend-tui = ["dep:crossterm", "dep:ratatui", "dep:windows-sys"]
backend-wasm = ["dep:ratzilla", "dep:ratatui"]

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", optional = true }
ratzilla = { version = "0.3", optional = true }

# Win32 API bindings
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[[bench]]
name = "math"
harness = false

[lib]
name = "abrash"
path = "src/lib.rs"

[[bin]]
name = "abrash"
path = "src/main.rs"
required-features = ["backend-tui"]

[[example]]
name = "cube_3d"
path = "examples/cube_3d.rs"

[[example]]
name = "lit_cube"
path = "examples/lit_cube.rs"

[[example]]
name = "wasm_cube_3d"
path = "examples/wasm_cube_3d.rs"
required-features = ["backend-wasm"]

[[bench]]
name = "rasterization"
harness = false

[[bench]]
name = "culling"
harness = false
