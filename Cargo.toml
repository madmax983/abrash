[workspace]
members = [
    ".",
    "crates/abrash-core",
    "crates/abrash-raycast",
    "crates/abrash-render",
    "crates/abrash-gpu-render",
    "crates/abrash-anim",
    "crates/abrash-skeletal",
    "crates/embed-demo",
]
resolver = "2"

[package]
name = "abrash"
version = "0.1.0"
edition = "2024"
autobenches = false
description = "Host/demo facade crate for the Abrash headless software rasterizer workspace."

[features]
default = ["backend-winit"]
nova = ["abrash-render/nova"]
simd = []
parallel = ["abrash-render/parallel", "abrash-core/parallel", "dep:rayon"]
backend-winit = ["dep:winit", "dep:softbuffer"]
gpu-render = ["dep:abrash-gpu-render", "dep:winit"]
gpu-engine-compare = ["gpu-render", "dep:bevy", "dep:fyrox"]
backend-tui = ["dep:crossterm", "dep:ratatui", "abrash-render/backend-tui"]
backend-wasm = ["dep:ratzilla", "dep:ratatui", "abrash-render/backend-wasm"]
gltf = ["abrash-skeletal/gltf"]

[dependencies]
abrash-core = { path = "crates/abrash-core" }
abrash-anim = { path = "crates/abrash-anim" }
abrash-render = { path = "crates/abrash-render" }
abrash-raycast = { path = "crates/abrash-raycast" }
abrash-skeletal = { path = "crates/abrash-skeletal" }
clap = { version = "4.5.57", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", optional = true }
ratzilla = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }
abrash-gpu-render = { path = "crates/abrash-gpu-render", optional = true }
winit = { version = "0.29.15", optional = true }
softbuffer = { version = "0.4.8", optional = true }
bevy = { version = "0.18.0", default-features = false, optional = true }
fyrox = { version = "1.0.0-rc.2", default-features = false, features = ["fyrox-impl"], optional = true }

comfy-table = "7.1"
foldhash = "0.2.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
rand = "0.8"
ratatui = "0.30.0"
crossterm = "0.29.0"

