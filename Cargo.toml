[package]
name = "abrash"
version = "0.1.0"
edition = "2024"
autobenches = false

[features]
default = ["backend-win32"]
nova = []
simd = []
parallel = ["dep:rayon"]
gpu-binning = ["dep:windows", "backend-win32", "dep:abrash-gpu"]
gpu-render = ["dep:abrash-gpu-render"]
gpu-engine-compare = ["gpu-render", "dep:bevy", "dep:fyrox"]
backend-win32 = ["dep:windows-sys"]
backend-tui = ["dep:crossterm", "dep:ratatui", "dep:windows-sys"]
backend-wasm = ["dep:ratzilla", "dep:ratatui"]

[dependencies]
clap = { version = "4.5.57", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.0", optional = true }
ratzilla = { version = "0.3", optional = true }
rayon = { version = "1.10", optional = true }
abrash-gpu = { path = "crates/abrash-gpu", optional = true, default-features = false, features = ["gpu-binning"] }
abrash-gpu-render = { path = "crates/abrash-gpu-render", optional = true }
bevy = { version = "0.18.0", default-features = false, optional = true }
fyrox = { version = "1.0.0-rc.2", default-features = false, features = ["fyrox-impl"], optional = true }

# Win32 API bindings
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# DirectX 12 bindings (for GPU compute binning)
windows = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }
comfy-table = "7.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[build-dependencies]
windows = { version = "0.59", optional = true, features = [
    "Win32_Graphics_Direct3D_Dxc",
] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
rand = "0.8"
ratatui = "0.30.0"
crossterm = "0.29.0"

[[bench]]
name = "math"
harness = false

[lib]
name = "abrash"
path = "src/lib.rs"

[[bin]]
name = "abrash"
path = "src/main.rs"
required-features = ["backend-tui"]

