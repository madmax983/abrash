[package]
name = "abrash"
version = "0.1.0"
edition = "2024"

[features]
default = []
simd = []

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
# Win32 API bindings
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "math"
harness = false

[lib]
name = "abrash"
path = "src/lib.rs"

[[bin]]
name = "abrash"
path = "src/main.rs"

[[example]]
name = "rotating_polygon"
path = "examples/rotating_polygon.rs"

[[example]]
name = "filled_primitives"
path = "examples/filled_primitives.rs"

[[example]]
name = "cube_3d"
path = "examples/cube_3d.rs"

[[example]]
name = "lit_cube"
path = "examples/lit_cube.rs"

[[example]]
name = "retro_cube"
path = "examples/retro_cube.rs"

[[bench]]
name = "rasterization"
harness = false

[[bench]]
name = "culling"
harness = false
