[package]
name = "abrash"
version = "0.1.0"
edition = "2024"

[features]
default = []
simd = []

[dependencies]
# Win32 API bindings
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "math"
harness = false

[lib]
name = "abrash"
path = "src/lib.rs"

[[bin]]
name = "abrash"
path = "src/main.rs"

[[example]]
name = "cube_3d"
path = "examples/cube_3d.rs"

[[example]]
name = "lit_cube"
path = "examples/lit_cube.rs"

[[example]]
name = "retro_cube"
path = "examples/retro_cube.rs"

[[bench]]
name = "rasterization"
harness = false
