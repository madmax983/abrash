[package]
name = "embed-demo"
version = "0.1.0"
edition = "2024"
description = "Offscreen rendering adapter — demonstrates abrash as an embeddable engine with no platform dependency."

# Platform seam proof: this crate depends ONLY on the engine crates.
# Run `cargo tree -p embed-demo --no-default-features` to verify:
#   - no windows-sys
#   - no crossterm
#   - no ratatui
#   - no ratzilla
[dependencies]
abrash-core   = { path = "../abrash-core"   }
abrash-render = { path = "../abrash-render", default-features = false }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
