[package]
name = "abrash-render"
version = "0.1.0"
edition = "2024"

[features]
default = []
nova = []
simd = []
parallel = ["dep:rayon", "abrash-core/parallel"]
gpu-binning = ["dep:abrash-gpu"]
backend-tui = ["dep:ratatui"]
backend-wasm = ["dep:ratatui"]

[dependencies]
abrash-core = { path = "../abrash-core" }
rayon = { version = "1.10", optional = true }
abrash-gpu = { path = "../abrash-gpu", optional = true, default-features = false, features = ["gpu-binning"] }
ratatui = { version = "0.30.0", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
inline_always = "allow"
too_many_lines = "allow"
struct_field_names = "allow"
suboptimal_flops = "allow"
