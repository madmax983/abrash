[package]
name = "abrash-render"
version = "0.1.0"
edition = "2024"

[features]
default = []
nova = []
simd = []
parallel = ["dep:rayon", "abrash-core/parallel"]
backend-tui = ["dep:ratatui"]
backend-wasm = ["dep:ratatui"]

[dev-dependencies]
proptest = "1.0"
criterion = "0.5.1"

[dependencies]
abrash-core = { path = "../abrash-core" }
rayon = { version = "1.10", optional = true }
ratatui = { version = "0.30.0", optional = true }
foldhash = "0.2.0"
smallvec = "1.15.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
many_single_char_names = "allow"
inline_always = "allow"
too_many_lines = "allow"
struct_field_names = "allow"
suboptimal_flops = "allow"

[[example]]
name = "paper_cutout_demo"
path = "examples/paper_cutout_demo.rs"
required-features = ["nova"]

[[bench]]
name = "paper_cutout_bench"
harness = false
required-features = ["nova"]

[[bench]]
name = "metaballs_bench"
harness = false
required-features = ["nova"]

[[bench]]
name = "filters_bench"
harness = false
